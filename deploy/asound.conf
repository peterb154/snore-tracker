# Installed to /etc/asound.conf. Lets ffmpeg (snore-record) and snore-web read the USB mic
# at the same time. Set SNORE_MIC=snoop in .env.
# CARD: the USB mic's name from `arecord -l` (the word in [brackets]).
pcm.snoop_raw {
    type dsnoop
    ipc_key 5978
    ipc_perm 0666
    slave {
        pcm "hw:CARD=Device,DEV=0"
        # Most USB mics only do their native rate; plug below converts to 16 kHz mono
        rate 48000
        channels 1
    }
}

pcm.snoop {
    type plug
    slave.pcm "snoop_raw"
}
